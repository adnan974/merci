<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Merci ! — Adn_dev</title>
<style>
  html, body { height:100%; margin:0; }
  body { display:flex; align-items:center; justify-content:center; background:#ffffff; color:#1a202c; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .spinner { position:absolute; width:36px; height:36px; border:3px solid #e2e8f0; border-top-color:#E08A3C; border-radius:50%; animation:spin .8s linear infinite, hide 0s 1.2s forwards; }
  .merci { margin:0; padding:0 20px; text-align:center; font-size:24px; line-height:32px; font-weight:bold; opacity:0; animation:show .4s 1.2s forwards; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes hide { to { visibility:hidden; } }
  @keyframes show { to { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .spinner { display:none; } .merci { opacity:1; animation:none; } }
</style>
</head>
<body>
  <div class="spinner" aria-hidden="true"></div>
  <p class="merci">Merci pour votre réponse&nbsp;!</p>
</body>
</html>
